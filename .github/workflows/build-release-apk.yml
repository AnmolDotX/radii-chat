name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release with Local APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          name: "Radii ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            android/release/radii-arm64-v8a.apk
            android/release/radii-release.apk
            android/release/radii-armeabi-v7a.apk
          generate_release_notes: true
          draft: false
          prerelease: false
