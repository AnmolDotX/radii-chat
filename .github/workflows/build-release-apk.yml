name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine Version Name & Code
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract tag without 'v' prefix (e.g., v1.0.1 -> 1.0.1)
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            # Extract from package.json for main branch commits
            PKG_VERSION=$(node -p "require('./package.json').version")
            VERSION_NAME="${PKG_VERSION}"
          fi
          
          # GitHub run number provides a strictly increasing integer for Android versionCode
          VERSION_CODE="${{ github.run_number }}"
          
          echo "Building with versionName: ${VERSION_NAME}, versionCode: ${VERSION_CODE}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}"
          cd ..
          node ./scripts/copy-release-apk.js

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radii-apks-v${{ steps.versioning.outputs.version_name }}-build${{ steps.versioning.outputs.version_code }}
          path: android/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Radii v${{ steps.versioning.outputs.version_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            android/release/radii-arm64-v8a.apk
            android/release/radii-release.apk
            android/release/radii.apk
            android/release/radii-armeabi-v7a.apk
          generate_release_notes: true
          draft: false
          prerelease: false
